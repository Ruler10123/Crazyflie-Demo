<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Crazyflie hardware setup</title>
  <desc id="desc">Computer, Crazyradio USB dongle, and Crazyflie drone hardware setup.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#25636a"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#f7f4ec"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#263238">Hardware Setup</text>

  <g transform="translate(92 128)">
    <rect width="300" height="192" rx="18" fill="#34424a"/>
    <rect x="28" y="26" width="244" height="126" rx="8" fill="#dfeaf0"/>
    <rect x="105" y="192" width="90" height="28" fill="#34424a"/>
    <rect x="68" y="220" width="164" height="20" rx="10" fill="#59666f"/>
    <text x="150" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#263238">Computer</text>
    <text x="150" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#455a64">runs server.py</text>
    <text x="150" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">1. Control computer</text>
  </g>

  <g transform="translate(465 220)">
    <rect width="138" height="48" rx="14" fill="#f2c14e" stroke="#8a6414" stroke-width="4"/>
    <rect x="126" y="13" width="58" height="22" rx="11" fill="#8a6414"/>
    <text x="72" y="-26" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">Crazyradio</text>
    <text x="72" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#455a64">USB dongle</text>
  </g>

  <path d="M634 244 C712 146 846 146 928 244" fill="none" stroke="#25636a" stroke-width="7" stroke-dasharray="16 14" marker-end="url(#arrow)"/>
  <text x="782" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#25636a">radio link</text>

  <g transform="translate(890 118)">
    <circle cx="40" cy="40" r="44" fill="#e9f4f5" stroke="#25636a" stroke-width="5"/>
    <circle cx="190" cy="40" r="44" fill="#e9f4f5" stroke="#25636a" stroke-width="5"/>
    <circle cx="40" cy="190" r="44" fill="#e9f4f5" stroke="#25636a" stroke-width="5"/>
    <circle cx="190" cy="190" r="44" fill="#e9f4f5" stroke="#25636a" stroke-width="5"/>
    <line x1="75" y1="75" x2="155" y2="155" stroke="#59666f" stroke-width="14" stroke-linecap="round"/>
    <line x1="155" y1="75" x2="75" y2="155" stroke="#59666f" stroke-width="14" stroke-linecap="round"/>
    <rect x="91" y="91" width="48" height="48" rx="12" fill="#f05d5e"/>
    <circle cx="115" cy="115" r="9" fill="#fff6d6"/>
    <text x="115" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">2. Crazyflie</text>
    <text x="115" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#455a64">power on first</text>
  </g>

  <rect x="166" y="492" width="868" height="44" rx="14" fill="#ffffff" stroke="#d1c7b7" stroke-width="2"/>
  <text x="600" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263238">server.py and Crazyradio must be on the same computer.</text>
</svg>
