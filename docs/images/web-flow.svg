<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Crazyflie Blocks web flow</title>
  <desc id="desc">The main web flow: scan, select URI, connect, choose blocks, drag blocks, and start.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#f7f4ec"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#263238">Web Operation Flow</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(62 110)">
      <rect width="190" height="128" rx="16" fill="#ffffff" stroke="#c7b99f" stroke-width="3"/>
      <circle cx="28" cy="40" r="22" fill="#f2c14e"/>
      <text x="28" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#422006">1</text>
      <text x="110" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#263238">Scan</text>
      <text x="110" y="94" text-anchor="middle" font-size="18" fill="#4f5b62">find drone</text>
    </g>
    <g transform="translate(320 110)">
      <rect width="210" height="128" rx="16" fill="#ffffff" stroke="#c7b99f" stroke-width="3"/>
      <circle cx="28" cy="40" r="22" fill="#f2c14e"/>
      <text x="28" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#422006">2</text>
      <text x="126" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#263238">Select URI</text>
      <text x="126" y="94" text-anchor="middle" font-size="18" fill="#4f5b62">choose available</text>
    </g>
    <g transform="translate(600 110)">
      <rect width="210" height="128" rx="16" fill="#ffffff" stroke="#c7b99f" stroke-width="3"/>
      <circle cx="28" cy="40" r="22" fill="#f2c14e"/>
      <text x="28" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#422006">3</text>
      <text x="126" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#263238">Connect</text>
      <text x="126" y="94" text-anchor="middle" font-size="18" fill="#4f5b62">identify pulse</text>
    </g>
    <g transform="translate(880 110)">
      <rect width="190" height="128" rx="16" fill="#ffffff" stroke="#c7b99f" stroke-width="3"/>
      <circle cx="28" cy="40" r="22" fill="#f2c14e"/>
      <text x="28" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#422006">4</text>
      <text x="112" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#263238">Blocks</text>
      <text x="112" y="94" text-anchor="middle" font-size="18" fill="#4f5b62">open tab</text>
    </g>
  </g>

  <path d="M258 174 H312" stroke="#475569" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M538 174 H592" stroke="#475569" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M818 174 H872" stroke="#475569" stroke-width="6" marker-end="url(#arrow)"/>

  <g transform="translate(158 350)" font-family="Arial, sans-serif">
    <rect width="250" height="132" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text x="125" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#9a3412">Drag Blocks</text>
    <rect x="62" y="74" width="126" height="36" rx="18" fill="#fb923c"/>
    <text x="125" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">start</text>
  </g>

  <g transform="translate(500 326)" font-family="Arial, sans-serif">
    <rect width="260" height="180" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <text x="130" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#263238">Script Area</text>
    <rect x="70" y="78" width="120" height="34" rx="17" fill="#f59e0b"/>
    <text x="130" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">start</text>
    <rect x="48" y="122" width="164" height="34" rx="17" fill="#10b981"/>
    <text x="130" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">spin fans 1s</text>
  </g>

  <g transform="translate(852 350)" font-family="Arial, sans-serif">
    <rect width="220" height="132" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <circle cx="110" cy="52" r="36" fill="#22c55e"/>
    <path d="M98 38 L98 66 L124 52 Z" fill="#ffffff"/>
    <text x="110" y="104" text-anchor="middle" font-size="28" font-weight="700" fill="#155e75">Start</text>
  </g>

  <path d="M414 416 H492" stroke="#475569" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M768 416 H844" stroke="#475569" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="174" y="550" width="852" height="42" rx="14" fill="#ffffff" stroke="#d1c7b7" stroke-width="2"/>
  <text x="600" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263238">If anything looks wrong during flight, press Stop first.</text>
</svg>
