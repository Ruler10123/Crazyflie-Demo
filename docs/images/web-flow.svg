<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Web operation flow</title>
  <desc id="desc">Scan, select URI, connect, switch to blocks, drag commands, and press start.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="500" fill="#f7f4ec"/>
  <rect x="52" y="62" width="190" height="118" rx="12" fill="#ffffff" stroke="#c7b99f" stroke-width="3"/>
  <circle cx="83" cy="95" r="18" fill="#f2c14e"/>
  <text x="83" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#422006">1</text>
  <text x="147" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">Scan</text>
  <text x="147" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4f5b62">find Crazyflie URI</text>
  <rect x="297" y="62" width="190" height="118" rx="12" fill="#ffffff" stroke="#c7b99f" stroke-width="3"/>
  <circle cx="328" cy="95" r="18" fill="#f2c14e"/>
  <text x="328" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#422006">2</text>
  <text x="392" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">Select URI</text>
  <text x="392" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4f5b62">choose available drone</text>
  <rect x="542" y="62" width="190" height="118" rx="12" fill="#ffffff" stroke="#c7b99f" stroke-width="3"/>
  <circle cx="573" cy="95" r="18" fill="#f2c14e"/>
  <text x="573" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#422006">3</text>
  <text x="637" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">Connect</text>
  <text x="637" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4f5b62">motors pulse briefly</text>
  <rect x="787" y="62" width="140" height="118" rx="12" fill="#ffffff" stroke="#c7b99f" stroke-width="3"/>
  <circle cx="818" cy="95" r="18" fill="#f2c14e"/>
  <text x="818" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#422006">4</text>
  <text x="857" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">Blocks</text>
  <text x="857" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4f5b62">open tab 2</text>
  <path d="M244 121 H292" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M489 121 H537" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M734 121 H782" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="90" y="274" width="220" height="130" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="200" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#9a3412">Drag blocks</text>
  <rect x="134" y="340" width="132" height="34" rx="17" fill="#fb923c"/>
  <text x="200" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">start</text>
  <rect x="380" y="254" width="220" height="170" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="490" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">Script area</text>
  <rect x="428" y="316" width="124" height="30" rx="15" fill="#f59e0b"/>
  <text x="490" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">start</text>
  <rect x="418" y="354" width="144" height="30" rx="15" fill="#10b981"/>
  <text x="490" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">spin fans 1 sec</text>
  <rect x="690" y="274" width="200" height="130" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <circle cx="790" cy="331" r="36" fill="#22c55e"/>
  <path d="M777 331 L786 342 L806 316" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="790" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#155e75">Start</text>
  <path d="M313 339 H375" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M604 339 H684" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="490" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#263238">Always keep the drone flat, propeller area clear, and use Stop if anything looks wrong.</text>
</svg>
