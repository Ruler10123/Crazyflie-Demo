<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crazyflie Blocks</title>
    <link rel="stylesheet" href="/styles.css?v=20260729i">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">CF</span>
          <div>
            <h1>Crazyflie Blocks</h1>
            <p id="connectionText">Disconnected</p>
          </div>
        </div>

        <section class="sidebar-pages">
          <div class="sidebar-tabs" role="tablist" aria-label="Sidebar pages">
            <button class="sidebar-tab active" type="button" role="tab" aria-selected="true" aria-controls="connectPage" data-sidebar-tab="connect">
              <span>1</span>
              <strong data-i18n="connectDrone">Connect Drone</strong>
            </button>
            <button class="sidebar-tab" type="button" role="tab" aria-selected="false" aria-controls="blocksPage" data-sidebar-tab="blocks">
              <span>2</span>
              <strong data-i18n="blocks">Blocks</strong>
            </button>
          </div>

          <div class="sidebar-page active" id="connectPage" role="tabpanel" data-sidebar-page="connect">
            <button id="scanButton" class="primary-button" data-i18n="scan">Scan</button>
            <div class="power-summary">
              <div id="powerText" class="battery-meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="battery-shell"><span class="battery-fill"></span></span>
                <strong class="battery-label" data-i18n="powerUnavailable">Unavailable</strong>
              </div>
              <span id="statusBadge" class="status-badge disconnected">Disconnected</span>
              <button id="powerRefreshButton" class="tiny-button" type="button" data-i18n="refreshPower" disabled>Refresh</button>
            </div>
            <label class="field">
              <span data-i18n="droneUri">Drone URI</span>
              <select id="uriSelect">
                <option value="" data-i18n="scanFirst">Scan first...</option>
              </select>
            </label>
            <div class="button-row">
              <button id="connectButton" class="primary-button" data-i18n="connect">Connect</button>
              <button id="disconnectButton" class="ghost-button" data-i18n="disconnect">Disconnect</button>
            </div>
            <section class="log-panel">
              <h3 data-i18n="log">Log</h3>
              <div class="status-summary">
                <p id="statusMessage" class="status-message" data-i18n="readyToScan">Ready to scan for Crazyflie.</p>
              </div>
            </section>
          </div>

          <div class="sidebar-page" id="blocksPage" role="tabpanel" data-sidebar-page="blocks" hidden>
            <div id="blockList" class="block-list"></div>
          </div>
        </section>
      </aside>

      <section id="workspaceArea" class="workspace">
        <div class="language-toggle" aria-label="Language">
          <button class="language-button" type="button" data-language="en">EN</button>
          <button class="language-button" type="button" data-language="fr">FR</button>
        </div>
        <div class="stage-controls" aria-label="Script controls">
          <button id="startButton" class="icon-button start-control" type="button" title="Start" data-i18n-title="start">
            <span class="flag-icon" aria-hidden="true"></span>
            <span class="sr-only" data-i18n="start">Start</span>
          </button>
          <button id="stopButton" class="icon-button stop-control" type="button" title="Stop" data-i18n-title="stop">
            <span class="stop-icon" aria-hidden="true"></span>
            <span class="sr-only" data-i18n="stop">Stop</span>
          </button>
          <button id="clearButton" class="icon-button clear-control" type="button" title="Clear" data-i18n-title="clear">
            <span class="trash-icon" aria-hidden="true"></span>
            <span class="sr-only" data-i18n="clear">Clear</span>
          </button>
        </div>
        <div class="script-area">
          <div id="scriptStack" class="script-stack" aria-label="Script workspace">
            <div id="scriptPlaceholder" class="script-placeholder" data-i18n="dragBlocks">Drag blocks from the left toolbox.</div>
          </div>
        </div>
      </section>
    </main>

    <script src="/blocks.js?v=20260729i"></script>
    <script src="/app.js?v=20260729i"></script>
  </body>
</html>
