<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crazyflie Blocks</title>
    <link rel="stylesheet" href="/styles.css?v=20260723h">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">CF</span>
          <div>
            <h1>Crazyflie Blocks</h1>
            <p id="connectionText">Disconnected</p>
          </div>
        </div>

        <section class="panel">
          <div class="panel-title">
            <span>1</span>
            <h2>Connect Drone</h2>
          </div>
          <button id="scanButton" class="primary-button">Scan</button>
          <div class="status-summary">
            <span id="statusBadge" class="status-badge disconnected">Disconnected</span>
            <p id="statusMessage" class="status-message">Ready to scan for Crazyflie.</p>
          </div>
          <label class="field">
            <span>Drone URI</span>
            <select id="uriSelect">
              <option value="">Scan first...</option>
            </select>
          </label>
          <div class="button-row">
            <button id="connectButton" class="primary-button">Connect</button>
            <button id="disconnectButton" class="ghost-button">Disconnect</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <span>2</span>
            <h2>Blocks</h2>
          </div>
          <div id="blockList" class="block-list"></div>
        </section>
      </aside>

      <section id="workspaceArea" class="workspace">
        <div class="stage-controls" aria-label="Script controls">
          <button id="startButton" class="icon-button start-control" type="button" title="Start">
            <span class="flag-icon" aria-hidden="true"></span>
            <span class="sr-only">Start</span>
          </button>
          <button id="stopButton" class="icon-button stop-control" type="button" title="Stop">
            <span class="stop-icon" aria-hidden="true"></span>
            <span class="sr-only">Stop</span>
          </button>
          <button id="clearButton" class="icon-button clear-control" type="button" title="Clear">
            <span class="trash-icon" aria-hidden="true"></span>
            <span class="sr-only">Clear</span>
          </button>
        </div>
        <div class="script-area">
          <div id="scriptStack" class="script-stack" aria-label="Script workspace">
            <div id="scriptPlaceholder" class="script-placeholder">Drag blocks from the left toolbox.</div>
          </div>
        </div>
      </section>
    </main>

    <script src="/blocks.js?v=20260723h"></script>
    <script src="/app.js?v=20260723h"></script>
  </body>
</html>
