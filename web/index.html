<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crazyflie Blocks</title>
    <link rel="stylesheet" href="/styles.css?v=20260728a">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">CF</span>
          <div>
            <h1>Crazyflie Blocks</h1>
            <p id="connectionText">Disconnected</p>
          </div>
        </div>

        <label class="field language-field">
          <span data-i18n="languageLabel">Language</span>
          <select id="languageSelect">
            <option value="en">English</option>
            <option value="fr">Français</option>
          </select>
        </label>

        <section class="panel">
          <div class="panel-title">
            <span>1</span>
            <h2 data-i18n="connectDrone">Connect Drone</h2>
          </div>
          <button id="scanButton" class="primary-button" data-i18n="scan">Scan</button>
          <div class="status-summary">
            <span id="statusBadge" class="status-badge disconnected">Disconnected</span>
            <p id="statusMessage" class="status-message" data-i18n="readyToScan">Ready to scan for Crazyflie.</p>
          </div>
          <label class="field">
            <span data-i18n="droneUri">Drone URI</span>
            <select id="uriSelect">
              <option value="" data-i18n="scanFirst">Scan first...</option>
            </select>
          </label>
          <div class="button-row">
            <button id="connectButton" class="primary-button" data-i18n="connect">Connect</button>
            <button id="disconnectButton" class="ghost-button" data-i18n="disconnect">Disconnect</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <span>2</span>
            <h2 data-i18n="blocks">Blocks</h2>
          </div>
          <div id="blockList" class="block-list"></div>
        </section>
      </aside>

      <section id="workspaceArea" class="workspace">
        <div class="stage-controls" aria-label="Script controls">
          <button id="startButton" class="icon-button start-control" type="button" title="Start" data-i18n-title="start">
            <span class="flag-icon" aria-hidden="true"></span>
            <span class="sr-only" data-i18n="start">Start</span>
          </button>
          <button id="stopButton" class="icon-button stop-control" type="button" title="Stop" data-i18n-title="stop">
            <span class="stop-icon" aria-hidden="true"></span>
            <span class="sr-only" data-i18n="stop">Stop</span>
          </button>
          <button id="clearButton" class="icon-button clear-control" type="button" title="Clear" data-i18n-title="clear">
            <span class="trash-icon" aria-hidden="true"></span>
            <span class="sr-only" data-i18n="clear">Clear</span>
          </button>
        </div>
        <div class="script-area">
          <div id="scriptStack" class="script-stack" aria-label="Script workspace">
            <div id="scriptPlaceholder" class="script-placeholder" data-i18n="dragBlocks">Drag blocks from the left toolbox.</div>
          </div>
        </div>
      </section>
    </main>

    <script src="/blocks.js?v=20260728a"></script>
    <script src="/app.js?v=20260728a"></script>
  </body>
</html>
